name: OpenLens

options:
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    DEVELOPMENT_TEAM: "$(OPENLENS_DEVELOPMENT_TEAM)"
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SDKROOT: iphoneos
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_VERSION: 5.0
  configs:
    Debug:
      COPY_PHASE_STRIP: NO
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
        - $(inherited)
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      MTL_FAST_MATH: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      COPY_PHASE_STRIP: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      MTL_FAST_MATH: YES
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

fileGroups:
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - CODE_REVIEW.md
  - SECURITY.md
  - LICENSE
  - AGENTS.md
  - Config
  - Tools

targets:
  OpenLens:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: OpenLens
        excludes:
          - "**/*.entitlements"
          - "**/*.md"
          - Assets.xcassets
      - path: OpenLensRemoteCore
      - path: OpenLens/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: OpenLensActivityWidgetExtension
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: OpenLens/OpenLens.entitlements
        CODE_SIGN_STYLE: "$(OPENLENS_CODE_SIGN_STYLE)"
        CURRENT_PROJECT_VERSION: 1
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_OpenLensAppGroup: $(OPENLENS_APP_GROUP)
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        MARKETING_VERSION: 1.3
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENLENS_APP_BUNDLE_ID)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        TARGETED_DEVICE_FAMILY: 1,2
    scheme:
      testTargets:
        - OpenLensTests

  OpenLensActivityWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: OpenLensActivityWidget
        excludes:
          - Info.plist
          - "**/*.entitlements"
          - Assets.xcassets
      - path: OpenLensActivityWidget/Assets.xcassets
        buildPhase: resources
      - path: OpenLens/Models/OpenLensActivityAttributes.swift
      - path: OpenLens/Models/SharedConnectionStore.swift
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_ENTITLEMENTS: OpenLensActivityWidget/OpenLensActivityWidget.entitlements
        CODE_SIGN_STYLE: "$(OPENLENS_CODE_SIGN_STYLE)"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OpenLensActivityWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: OpenLensActivityWidget
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        MARKETING_VERSION: 1.3
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENLENS_WIDGET_BUNDLE_ID)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: 1,2

  OpenLensTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: OpenLensTests
    dependencies:
      - target: OpenLens
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: "$(OPENLENS_CODE_SIGN_STYLE)"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        MARKETING_VERSION: 1.1
        PRODUCT_BUNDLE_IDENTIFIER: "$(OPENLENS_TESTS_BUNDLE_ID)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        SKIP_INSTALL: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: 1,2
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenLens.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenLens"
        TEST_TARGET_NAME: OpenLens

schemes:
  OpenLens:
    build:
      targets:
        OpenLens: all
        OpenLensTests:
          - test
          - analyze
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: OpenLensTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  OpenLensActivityWidgetExtension:
    build:
      targets:
        OpenLensActivityWidgetExtension: all
        OpenLens:
          - run
          - profile
          - archive
          - analyze
    run:
      config: Debug
      executable: OpenLens
      environmentVariables:
        _XCWidgetKind: ""
        _XCWidgetDefaultView: timeline
        _XCWidgetFamily: systemMedium
    profile:
      config: Release
      executable: OpenLens
    analyze:
      config: Debug
    archive:
      config: Release

  OpenLens_AppStoreScreenshots:
    build:
      targets:
        OpenLens: all
    run:
      config: Debug
      executable: OpenLens
      commandLineArguments:
        SCREENSHOT_MODE: true
    profile:
      config: Release
      executable: OpenLens
