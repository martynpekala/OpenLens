name: Feature request
description: Suggest a product or developer-experience improvement
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What are you trying to do that is currently awkward, missing, or unclear?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the outcome you want, not just the implementation.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Real-world use case
      description: Explain when this would help and who it helps.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - iOS app
        - Live Activity widget
        - Connection / onboarding
        - Chat / sessions
        - Workspace / review
        - openlens-qr CLI
        - App Store Shot Studio
        - Documentation

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, but helpful.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, examples, or links.
